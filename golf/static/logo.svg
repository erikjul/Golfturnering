<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#175A3D"/>
      <stop offset="1" stop-color="#0B3222"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D27A"/>
      <stop offset=".5" stop-color="#E9B949"/>
      <stop offset="1" stop-color="#C9962C"/>
    </linearGradient>
    <radialGradient id="ball" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".65" stop-color="#EEF2EC"/>
      <stop offset="1" stop-color="#B9C4BA"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E9B949" stop-opacity=".35"/>
      <stop offset="1" stop-color="#E9B949" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <rect y="4.5" width="6" height="1.5" fill="#000" opacity=".09"/>
    </pattern>
    <pattern id="dimples" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="11" cy="11" r="4.2" fill="#B7C2B8" opacity=".55"/>
    </pattern>
    <clipPath id="ballclip"><circle cx="196" cy="342" r="118"/></clipPath>
  </defs>

  <!-- tavle -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#lines)"/>
  <rect x="22" y="22" width="468" height="468" rx="40" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <rect x="36" y="36" width="440" height="440" rx="30" fill="none" stroke="#E9B949" stroke-width="1.5" opacity=".35"/>

  <!-- glød bag flaget -->
  <circle cx="352" cy="176" r="150" fill="url(#glow)"/>

  <!-- green/horisont -->
  <path d="M60 396 C 160 366, 300 366, 452 402 L452 452 L60 452 Z" fill="#0A2A1C" opacity=".85"/>
  <path d="M60 396 C 160 366, 300 366, 452 402" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>

  <!-- hul -->
  <ellipse cx="352" cy="384" rx="34" ry="10" fill="#06170F"/>

  <!-- flagstang og flag -->
  <rect x="348" y="108" width="8" height="278" rx="4" fill="#F2F6F1"/>
  <rect x="348" y="108" width="8" height="278" rx="4" fill="#000" opacity=".12" transform="translate(3 0)"/>
  <path d="M356 112 L462 150 L356 190 Z" fill="url(#gold)"/>
  <path d="M356 112 L462 150 L356 190 Z" fill="none" stroke="#B88A24" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="352" cy="106" r="10" fill="url(#gold)"/>

  <!-- golfbold -->
  <ellipse cx="200" cy="452" rx="112" ry="16" fill="#000" opacity=".28"/>
  <circle cx="196" cy="342" r="118" fill="url(#ball)"/>
  <g clip-path="url(#ballclip)">
    <rect x="60" y="210" width="280" height="270" fill="url(#dimples)"/>
  </g>
  <circle cx="196" cy="342" r="118" fill="none" stroke="#7E8F82" stroke-width="2.5" opacity=".6"/>
  <ellipse cx="152" cy="290" rx="34" ry="20" fill="#fff" opacity=".7" transform="rotate(-30 152 290)"/>
</svg>
